name: Deploy Trakify Sales Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/create-sales-integration/**"
      - "supabase/functions/sales-webhook/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-sales-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vhtijxevmuitwohswoqn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Add a Supabase access token under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy create-sales-integration
        run: supabase functions deploy create-sales-integration --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy sales-webhook
        run: supabase functions deploy sales-webhook --project-ref "$SUPABASE_PROJECT_ID"
